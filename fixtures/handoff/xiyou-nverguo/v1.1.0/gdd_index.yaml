    anchor_heading: "## 2.2 七日朝议质询与朱砂呈词"
    summary: "每日分为昼间呈词质询与夜间宵禁筹措两段；玩家在国主与太师两派间呈递证物、控制朝堂疑心值，并在第七日前破除因果印记或借势反制太师。"
